[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ocean2mqtt"
version = "0.2.0b24"
description = "Passerelle EnOcean <-> MQTT multi-marques, façon Zigbee2MQTT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "eHomeLabs" }]
keywords = ["enocean", "mqtt", "home-assistant", "domotique", "gateway"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
]
dependencies = [
  "pyserial-asyncio-fast>=0.16",
  "PyYAML>=6.0",
  "paho-mqtt>=2.0",
  "aiohttp>=3.9",
]

[project.scripts]
ocean2mqtt = "ocean2mqtt.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "jsonschema>=4.22",
  "ruff>=0.6",
  "amqtt>=0.11",
]

[project.urls]
Homepage = "https://github.com/eHomeLabs/Ocean2MQTT"
Issues = "https://github.com/eHomeLabs/Ocean2MQTT/issues"

[tool.hatch.build]
# Interface web construite (npm run build), ignorée par git mais livrée dans le paquet
artifacts = ["src/ocean2mqtt/frontend/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/ocean2mqtt"]

[tool.hatch.build.targets.wheel.force-include]
"produits" = "ocean2mqtt/produits"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Un test bloqué (broker MQTT de test…) échoue avec la pile des threads au lieu de
# bloquer la CI pendant des heures.
timeout = 120
faulthandler_timeout = 90

[tool.ruff]
line-length = 100
target-version = "py312"
