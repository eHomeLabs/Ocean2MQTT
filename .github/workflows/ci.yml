name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Fiches produits
        run: python -m ocean2mqtt.library
      - name: Lint
        run: ruff check src tests tools
      - name: Tests
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -q -o faulthandler_timeout=90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construction de l'interface
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Paquet (interface et fiches incluses)
        run: |
          pip install build
          python -m build
          python -c "import zipfile,glob; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(x.endswith('produits/nodon/sin-2-fp-01.yaml') for x in n); assert any(x.endswith('frontend/index.html') for x in n)"
