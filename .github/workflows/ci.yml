name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Fiches produits
        run: python -m ocean2mqtt.library
      - name: Tests
        run: pytest -q
      - name: Paquet
        run: |
          pip install build
          python -m build
          python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(n.endswith('produits/nodon/sin-2-fp-01.yaml') for n in names)"
