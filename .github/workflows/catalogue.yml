name: Catalogue des produits

# Page web publique des produits compatibles (GitHub Pages) :
# https://ehomelabs.github.io/Ocean2MQTT/
on:
  push:
    branches: [main]
    paths: ["produits/**", "tools/catalog/**", "tools/build_catalog.py", "docs/logo/**", "frontend/src/assets/**",
            ".github/workflows/catalogue.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python tools/build_catalog.py site
      - uses: actions/configure-pages@v5
      - id: artifact
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
