name: Suggest a new EnOcean device / Proposer un produit EnOcean
description: Add a device to the Ocean2MQTT library / Ajouter un appareil au catalogue
title: "[Device] <brand> <model>"
labels: ["nouveau produit"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Fill in what you know; optional fields may stay empty. Provide pairing steps in at least one language. The maintainer uses the `accepté` label to approve new devices. Once approved by the maintainer, the sheet is created automatically.
        Merci ! Remplissez ce que vous savez : les champs facultatifs peuvent rester vides. Indiquez la procédure d’appairage dans au moins une langue. Le mainteneur utilise l’étiquette `accepté` pour approuver les nouveaux produits. Après validation par le mainteneur, la fiche est créée automatiquement et le produit apparaît dans la bibliothèque à la version suivante.

        Produits déjà disponibles / devices already supported : [catalogue](https://ehomelabs.github.io/Ocean2MQTT/). Aide / help : [Ajouter un produit non supporté](https://github.com/eHomeLabs/Ocean2MQTT/wiki/Ajouter-un-produit-non-support%C3%A9).
  - type: input
    id: marque
    attributes:
      label: Brand / Marque
      placeholder: "Ubiwizz"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference / Référence
      description: Main commercial reference. / Référence commerciale principale (autres références dans « Notes »).
      placeholder: "UBILD001"
    validations:
      required: true
  - type: input
    id: nom_fr
    attributes:
      label: French name / Nom en français
      placeholder: "Détecteur de fumée"
  - type: input
    id: nom_en
    attributes:
      label: English name / Nom en anglais
      placeholder: "Smoke detector"
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - capteur (sensor)
        - interrupteur (switch / remote)
        - actionneur (actuator, relay, dimmer, shutter)
        - prise (plug)
        - chauffage (heating)
    validations:
      required: true
  - type: input
    id: eep
    attributes:
      label: EEP profile / Profil EEP
      description: Use RORG-FUNC-TYPE format, for example A5-02-05. Shown in the manual, datasheet or by Ocean2MQTT (heard transmitters). / Format RORG-FUNC-TYPE, ex. A5-02-05. Indiqué dans la notice ou la fiche technique, ou affiché par Ocean2MQTT (émetteurs entendus).
      placeholder: "F6-05-02"
    validations:
      required: true
  - type: input
    id: eep_supplementaires
    attributes:
      label: Other profiles sent / Autres profils émis
      placeholder: "A5-09-05"
  - type: input
    id: fabricant_id
    attributes:
      label: EnOcean manufacturer ID / Code fabricant EnOcean
      description: Shown by Ocean2MQTT for heard transmitters. / Affiché par Ocean2MQTT pour les émetteurs entendus (ex. 0x046 = NodOn).
      placeholder: "0x046"
  - type: dropdown
    id: appairage
    attributes:
      label: Pairing mode / Mode d'appairage
      description: If unsure, choose "I don't know". / En cas de doute, laissez « je ne sais pas ».
      options:
        - je ne sais pas / I don't know
        - rps (appui sur une touche / button press)
        - 1bs (contact)
        - 4bs (bouton Learn, télégramme d'apprentissage / Learn button)
        - 4bs_bidir (avec réponse, ex. tête thermostatique / with answer, e.g. radiator valve)
        - ute_bidir (demande UTE avec réponse, actionneurs D2 / UTE with answer)
        - ute_uni (demande UTE sans réponse / UTE without answer)
    validations:
      required: true
  - type: textarea
    id: etapes_fr
    attributes:
      label: Pairing steps in French / Procédure d'appairage en français
      description: One step per line. Fill in the English or French pairing steps. / Une étape par ligne, en anglais ou en français.
      placeholder: |
        Installez la pile 9 V fournie.
        Appuyez 2 secondes sur le bouton « Learn » jusqu'au bip.
  - type: textarea
    id: etapes_en
    attributes:
      label: Pairing steps in English / Procédure d'appairage en anglais
      description: One step per line. Fill in the English or French pairing steps. / Une étape par ligne, en anglais ou en français.
  - type: input
    id: canaux
    attributes:
      label: Number of channels (actuators) / Nombre de canaux (actionneurs)
      placeholder: "1"
  - type: checkboxes
    id: options
    attributes:
      label: Features / Fonctions
      options:
        - label: Mesure de puissance / énergie (power / energy metering)
        - label: Remote Commissioning (ReMan / ReCom)
  - type: input
    id: notice
    attributes:
      label: Manual or datasheet link / Lien vers la notice ou la fiche technique
      placeholder: "https://…"
  - type: textarea
    id: photo
    attributes:
      label: Device picture / Photo du produit
      description: Optional. Only attach a photo whose license permits publication and redistribution with Ocean2MQTT, or for which the manufacturer or rights holder has granted that permission. / Facultatif. Joignez une photo dont la licence permet la publication et la redistribution avec Ocean2MQTT, ou pour laquelle le fabricant ou l’ayant droit a donné son accord pour ces usages.
  - type: textarea
    id: description
    attributes:
      label: What already works, notes / Ce qui fonctionne déjà, remarques
      description: Generic mode, other references, special values… / Mode générique, autres références, valeurs particulières…
  - type: textarea
    id: telegrammes
    attributes:
      label: Telegrams / Télégrammes
      description: Filter the CSV export to the device and include the corresponding actions. Remove Remote Commissioning codes and other secrets. / Export CSV filtré sur le produit, avec l’action associée. Retirez les codes Remote Commissioning et autres secrets.
  - type: checkboxes
    id: accord
    attributes:
      label: License / Licence
      options:
        - label: I agree that the information in this submission may be published under MIT in Ocean2MQTT. / J’accepte que les informations de cette fiche soient publiées sous MIT dans Ocean2MQTT.
          required: true
  - type: checkboxes
    id: photo_permission
    attributes:
      label: Photo rights / Droits de la photo
      options:
        - label: If I attach a product photo, I confirm that its license permits publication and redistribution with Ocean2MQTT, or that I have permission from the manufacturer or rights holder for these uses. / Si je joins une photo produit, je confirme que sa licence permet sa publication et sa redistribution avec Ocean2MQTT, ou que j’ai l’accord du fabricant ou de l’ayant droit pour ces usages.
          required: true
