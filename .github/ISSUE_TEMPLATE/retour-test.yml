name: Confirm a device works / Confirmer un produit
description: Report a hardware test for a Community or generic device / Partager un test matériel
title: "[Test report] <brand> <model>"
labels: ["retour de test"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! This form is prefilled when opened from Ocean2MQTT. Once checked by the maintainer, the device sheet moves from "Community" to "Validated" using the `validé` label.
        Merci ! Ce formulaire est prérempli quand il est ouvert depuis Ocean2MQTT (fiche du produit → Informations → « Confirmer que ce produit fonctionne »). Après vérification par le mainteneur, la fiche passe de « Communauté » à « Validé » avec l’étiquette `validé`.
  - type: markdown
    attributes:
      value: |
        For a generic profile, enter the brand, exact model and tested pairing steps. A separate validated sheet will be created after review; the generic profile stays generic.
        Pour un profil générique, indiquez la marque, la référence exacte et les étapes d’appairage testées. Après contrôle, une fiche validée sera créée pour ce modèle ; le profil reste générique.
  - type: input
    id: fiche
    attributes:
      label: Device sheet / Fiche
      description: Library sheet id. / Identifiant de la fiche dans la bibliothèque (marque/référence).
      placeholder: "eltako/faft60"
    validations:
      required: true
  - type: input
    id: marque
    attributes:
      label: Brand / Marque
      description: Required for a generic profile. / Obligatoire pour un profil générique.
  - type: input
    id: reference
    attributes:
      label: Model reference / Référence
      description: Exact tested model, required for a generic profile. / Modèle exact testé, obligatoire pour un profil générique.
  - type: input
    id: photo
    attributes:
      label: Product photo link / Lien photo du produit
      description: Optional. Only share a photo you may publish; the maintainer will review it. / Facultatif. Image publiable avec autorisation, contrôlée par le mainteneur.
  - type: input
    id: notice
    attributes:
      label: Manual link / Lien notice
      description: Optional HTTPS manufacturer manual. / Notice fabricant HTTPS facultative.
  - type: textarea
    id: appairage
    attributes:
      label: Tested pairing steps / Procédure d'appairage testée
      description: Required for a generic profile, in French or English. / Obligatoire pour un profil générique, en français ou anglais.
  - type: input
    id: version
    attributes:
      label: Ocean2MQTT version / Version d'Ocean2MQTT
      placeholder: "0.2.0b22"
  - type: input
    id: eep
    attributes:
      label: EEP profile / Profil EEP
      placeholder: "A5-04-02"
  - type: checkboxes
    id: fonctions
    attributes:
      label: What works / Ce qui fonctionne
      description: Tick what you checked. / Cochez ce que vous avez vérifié.
      options:
        - label: Appairage / Pairing
        - label: Mesures et états (valeurs cohérentes) / Measurements and states (plausible values)
        - label: Commandes (marche/arrêt, volet, fil pilote…) / Commands
        - label: Réglages / Settings
        - label: Remote Commissioning
  - type: textarea
    id: valeurs
    attributes:
      label: Last received values / Dernières valeurs reçues
      description: Filled in by Ocean2MQTT. / Rempli automatiquement depuis Ocean2MQTT.
      render: json
  - type: textarea
    id: telegrammes
    attributes:
      label: Telegrams / Télégrammes
      description: A few device telegrams with Remote Commissioning codes and other secrets removed. / Quelques télégrammes du produit, sans codes Remote Commissioning ni autres secrets.
      render: text
  - type: textarea
    id: remarques
    attributes:
      label: Notes, what does not work / Remarques, ce qui ne fonctionne pas
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: J'ai testé ce produit moi-même avec Ocean2MQTT. / I tested this device myself with Ocean2MQTT.
          required: true
