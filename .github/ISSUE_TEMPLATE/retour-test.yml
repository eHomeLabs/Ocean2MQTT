name: Confirm a device works / Confirmer un produit
description: Report a hardware test for a Community device / Partager un test matériel
title: "[Test report] <brand> <model>"
labels: ["retour de test"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! This form is prefilled when opened from Ocean2MQTT. Once checked by the maintainer, the device sheet moves from "Community" to "Validated".
        Merci ! Ce formulaire est prérempli quand il est ouvert depuis Ocean2MQTT (fiche du produit → Informations → « Confirmer que ce produit fonctionne »). Après vérification par le mainteneur, la fiche passe de « Communauté » à « Validé ».
  - type: input
    id: fiche
    attributes:
      label: Device sheet / Fiche
      description: Library sheet id. / Identifiant de la fiche dans la bibliothèque (marque/référence).
      placeholder: "eltako/faft60"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ocean2MQTT version / Version d'Ocean2MQTT
      placeholder: "0.2.0b22"
  - type: input
    id: eep
    attributes:
      label: EEP profile / Profil EEP
      placeholder: "A5-04-02"
  - type: checkboxes
    id: fonctions
    attributes:
      label: What works / Ce qui fonctionne
      description: Tick what you checked. / Cochez ce que vous avez vérifié.
      options:
        - label: Appairage / Pairing
        - label: Mesures et états (valeurs cohérentes) / Measurements and states (plausible values)
        - label: Commandes (marche/arrêt, volet, fil pilote…) / Commands
        - label: Réglages / Settings
        - label: Remote Commissioning
  - type: textarea
    id: valeurs
    attributes:
      label: Last received values / Dernières valeurs reçues
      description: Filled in by Ocean2MQTT. / Rempli automatiquement depuis Ocean2MQTT.
      render: json
  - type: textarea
    id: telegrammes
    attributes:
      label: Telegrams / Télégrammes
      description: A few device telegrams with Remote Commissioning codes and other secrets removed. / Quelques télégrammes du produit, sans codes Remote Commissioning ni autres secrets.
      render: text
  - type: textarea
    id: remarques
    attributes:
      label: Notes, what does not work / Remarques, ce qui ne fonctionne pas
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: J'ai testé ce produit moi-même avec Ocean2MQTT. / I tested this device myself with Ocean2MQTT.
          required: true
