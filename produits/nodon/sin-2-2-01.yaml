ref: SIN-2-2-01
marque: NodOn
nom:
  fr: Module Éclairage ON/OFF EnOcean (2 canaux)
  en: EnOcean ON/OFF Lighting Relay Switch (2 channels)
  de: EnOcean Licht-Schaltmodul EIN/AUS (2 Kanäle)
type: actionneur
eep: D2-01-12
fabricant_id: 70
appairage:
  mode: ute_bidir
  etapes:
    fr:
    - Le module doit être sous tension.
    - 'Appuyez 3 fois rapidement sur le bouton du module : la LED scintille en rouge (30 s).'
    - Les 2 canaux sont appairés en une seule fois.
    - 'Le module envoie alors sa demande d''appairage : Ocean2MQTT répond automatiquement, la LED clignote
      2 fois en vert.'
    en:
    - The module must be powered.
    - 'Press the module button 3 times quickly: the LED flickers red (30 s).'
    - Both channels are paired at once.
    - 'The module then sends its pairing request: Ocean2MQTT answers automatically and the LED blinks
      green twice.'
    de:
    - Das Modul muss mit Strom versorgt sein.
    - 'Drücken Sie 3-mal schnell die Taste des Moduls: Die LED flackert rot (30 s).'
    - Beide Kanäle werden auf einmal angelernt.
    - 'Das Modul sendet dann seine Anlernanfrage: Ocean2MQTT antwortet automatisch, die LED blinkt 2-mal
      grün.'
canaux: 2
reglages:
- led
- power_on_state
- local_control
- taught_in
- auto_off
- delay_off
- switch_type
recom: true
support: valide
notice: https://support.nodon.fr/support/solutions/articles/150000052164
