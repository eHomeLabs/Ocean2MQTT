ref: SIN-2-RS-01
marque: NodOn
nom:
  fr: Module Volet Roulant EnOcean
  en: EnOcean Roller Shutter Relay Switch
  de: EnOcean Rollladenmodul
type: actionneur
eep: D2-05-00
fabricant_id: 70
appairage:
  mode: ute_bidir
  etapes:
    fr:
    - Le module doit être sous tension.
    - 'Appuyez 3 fois rapidement sur le bouton du module : la LED scintille en rouge (30 s).'
    - 'Le module envoie alors sa demande d''appairage : Ocean2MQTT répond automatiquement, la LED clignote
      2 fois en vert.'
    en:
    - The module must be powered.
    - 'Press the module button 3 times quickly: the LED flickers red (30 s).'
    - 'The module then sends its pairing request: Ocean2MQTT answers automatically and the LED blinks
      green twice.'
    de:
    - Das Modul muss mit Strom versorgt sein.
    - 'Drücken Sie 3-mal schnell die Taste des Moduls: Die LED flackert rot (30 s).'
    - 'Das Modul sendet dann seine Anlernanfrage: Ocean2MQTT antwortet automatisch, die LED blinkt 2-mal
      grün.'
  apres:
    fr: 'Pensez à calibrer le volet si ce n''est pas déjà fait : 5 appuis brefs sur le bouton du module
      (cycle montée / descente / montée).'
    en: 'Remember to calibrate the shutter if not done yet: 5 short presses on the module button (up /
      down / up cycle).'
    de: 'Kalibrieren Sie den Rollladen, falls noch nicht geschehen: 5 kurze Tastendrücke am Modul (Zyklus
      auf / ab / auf).'
reglages:
- roller_shutter
recom: true
support: valide
notice: https://support.nodon.fr/support/solutions/articles/150000052163
photo: sin-2-rs-01.png
