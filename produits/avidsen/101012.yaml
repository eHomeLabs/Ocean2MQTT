ref: '101012'
marque: Avidsen
nom:
  fr: Sonde de température et d’humidité avec affichage numérique et consigne locale
  en: Temperature and humidity sensor with digital display and local set point
type: capteur
eep: A5-10-12
appairage:
  mode: 4bs
  etapes:
    fr:
    - Alimentez la sonde avec une pile CR2450 ou en micro-USB 5 V.
    - Lancez l’appairage dans Ocean2MQTT en choisissant Avidsen 101012.
    - Maintenez plus de 3 secondes le bouton dans le trou au dos pour l’appairage. Un appui court bascule uniquement
      °C/°F.
    - Vérifiez ensuite les valeurs reçues ; les boutons +/− règlent la consigne locale émise par la sonde.
    en:
    - Power the sensor with a CR2450 battery or 5 V micro-USB.
    - Start pairing in Ocean2MQTT and select Avidsen 101012.
    - Hold the button in the rear pinhole for more than 3 seconds to pair. A short press only toggles °C/°F.
    - Check the received values; the +/− buttons change the local set point transmitted by the sensor.
notice: https://pim.avidsen.com/documentsproduits/fr/101012V1-fiche-produit.pdf
photo: 101012.png
reglages:
- temperature_offset
- humidity_offset
- timeout
support: communaute
notes: 'Appairage, température et humidité confirmés sur matériel par un utilisateur. Consigne locale reçue en lecture
  seule : setpoint_raw 0–255 conservé ; setpoint en °C = round(brut × 0,32 + 0,24) / 2, selon quatre relevés écran
  (68→11,0 ; 125→20,0 ; 209→33,5 ; 218→35,0). Conversion spécifique à 101012 ; pas au profil générique. Codage pile
  faible non documenté, aucun bit réservé interprété. / Pairing and temperature/humidity verified by user; local
  set point conversion calibrated against four screen readings, with raw value retained. Battery-low encoding remains
  undocumented.'
decodeur: avidsen_101012
