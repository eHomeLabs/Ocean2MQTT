    - Exposez la cellule solaire à la lumière pour charger la réserve interne.
    - Lancez l’appairage dans Ocean2MQTT, puis appuyez sur la touche à l’arrière de la sonde.
    en:
    - Expose the solar cell to light to charge the internal energy store.
    - Start pairing in Ocean2MQTT, then press the button on the back of the sensor.
