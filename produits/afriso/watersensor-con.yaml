ref: WaterSensor
marque: Afriso
nom:
  fr: Détecteur d'eau (conductivité)
  en: Conductivity water sensor
type: capteur
eep: A5-30-03
appairage:
  mode: 4bs
  etapes:
    fr:
    - Retirez le capteur de sa sonde, puis ôtez le capot avec un tournevis.
    - 'Appuyez sur la touche LRN avec un objet non conducteur : le télégramme d''apprentissage est envoyé.'
    en:
    - Remove the sensor from its probe, then lift the cover with a screwdriver.
    - 'Press the LRN key with a non-conductive object: the teach-in telegram is sent.'
variantes:
- '78146'
notice: https://www.afriso.com/en/PM/Domestic-technology/Product-range-AFRISO-smart-home/Conductivity-water-sensor-WaterSensor-con
